# Basic
root        : ~                                                                 # Root directory of the current run.
arch        : "fourierdiff"                                                     # Model architecture or family (e.g., resnet).
model       : &model "fourierdiff"                                              # Model name (e.g., resnet50).
data        : &data ~                                                           # Dataset name (e.g., cifar10) or directory (e.g., data/cifar10).
fullname    : &fullname "fourierdiff"                                           # Full name of the current run (e.g., resnet50_cifar10_01). If not set, it will be this file's name.
save_dir    : &save_dir ~                                                       # Saving directory. If not set, it will be `root/arch/model/data`.
weights     : &weights "zoo/vision/enhance/multitask/fourierdiff/fourierdiff/pretrained/256x256_diffusion_uncond.pt"  # Path to the pretrained weights.
device      : 0                                                                 # Running device (i.e., cuda:0 | cuda:0,1,2,3 | cpu).
torchrun    : False                                                             # If ``True``, use torch.distributed.run to run the training script.
master_port : 7777                                                              # Master port for distributed training.
master_addr : "localhost"                                                       # Master address for distributed training.
local_rank  : -1                                                                # Local rank for distributed training.
epochs      : &epochs ~                                                         # Training epochs.
steps       : &steps ~                                                          # Training steps.
seed        : 1234                                                              # Random seed.
imgsz       : &imgsz 256                                                        # Image size for the model.
resize      : False                                                             # Resize the input image to `imgsz`.
benchmark   : False                                                             # Benchmark the model.
save_result : True                                                              # Save the result of the model.
save_image  : True                                                              # Save the output image.
save_debug  : &save_debug True                                                  # Save the debug information.
use_fullname: True                                                              # Use the full name for the save_dir.
keep_subdirs: False                                                             # Keep subdirectories in the save_dir.
exist_ok    : True                                                              # If ``False``, it will delete the save directory if it already exists.
verbose     : &verbose True                                                     # Verbosity.

# Misc
opt_path    : "llve.yaml"
sigma_y     : 0.0
eta         : 0.85
subset_start: -1
subset_end  : -1
noise_type  : "gaussian"
