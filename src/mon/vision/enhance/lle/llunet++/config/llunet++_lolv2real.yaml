# Basic
root        : ~                                                                 # Root directory of the current run.
arch        : "llunet++"                                                        # Model architecture or family (e.g., resnet).
model       : &model "llunet++"                                                 # Model name (e.g., resnet50).
data        : &data "lolv2real"                                                 # Dataset name (e.g., cifar10) or directory (e.g., data/cifar10).
fullname    : &fullname "llunet++_lolv2real"                                    # Full name of the current run (e.g., resnet50_cifar10_01). If not set, it will be this file's name.
save_dir    : &save_dir ~                                                       # Saving directory. If not set, it will be `root/arch/model/data`.
weights     : &weights "zoo/vision/enhance/lle/llunet++/llunet++/lolv2real/llunet++_lolv2real_psnr.pt" # Path to the pretrained weights.
device      : 0                                                                 # Running device (i.e., cuda:0 | cuda:0,1,2,3 | cpu).
torchrun    : False                                                             # If ``True``, use torch.distributed.run to run the training script.
master_port : 7777                                                              # Master port for distributed training.
master_addr : "localhost"                                                       # Master address for distributed training.
local_rank  : -1                                                                # Local rank for distributed training.
epochs      : &epochs 100                                                       # Training epochs.
steps       : &steps ~                                                          # Training steps.
seed        : 0                                                                 # Random seed.
imgsz       : &imgsz 384                                                        # Image size for the model.
resize      : False                                                             # Resize the input image to `imgsz`.
benchmark   : False                                                             # Benchmark the model.
save_result : True                                                              # Save the result of the model.
save_image  : True                                                              # Save the output image.
save_debug  : &save_debug True                                                  # Save the debug information.
use_fullname: True                                                              # Use the full name for the save_dir.
keep_subdirs: False                                                             # Keep subdirectories in the save_dir.
exist_ok    : True                                                              # If ``False``, it will delete the save directory if it already exists.
verbose     : &verbose True                                                     # Verbosity.

# Optimizer
optimizer: &optimizer                                                           # Optimizer(s).
  lr          : 0.00001
  weight_decay: 0.0001

# Loss
loss: &loss
  loss_weights: [0.35, 0.10, 0.25, 0.30]

# Datamodule
datamodule:
  name      : *data                                                             # Data module name (e.g., cifar10).
  root      : "data/lolv2"                                                      # Root directory of the dataset.
  transform :                                                                   # Data augmentation.
    - {name: "resize", height: *imgsz, width : *imgsz}
  to_tensor : True                                                              # If ``True``, convert the data to tensor.
  batch_size: 4                                                                 # Batch size.
  cache_data: False                                                             # If ``True``, cache the data.
  shuffle   : True                                                              # If ``True``, shuffle the data.
  verbose   : *verbose                                                          # Verbosity.
