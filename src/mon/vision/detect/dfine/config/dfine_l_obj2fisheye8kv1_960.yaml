# Basic
root        : ~                                                                 # Root directory of the current run.
arch        : "dfine"                                                           # Model architecture or family (e.g., resnet).
model       : &model "dfine_l"                                                  # Model name (e.g., resnet50).
data        : &data "fisheye8kv1"                                               # Dataset name (e.g., cifar10) or directory (e.g., data/cifar10).
fullname    : &fullname "dfine_l_obj2fisheye8kv1_960"                           # Full name of the current run (e.g., resnet50_cifar10_01). If not set, it will be this file's name.
save_dir    : &save_dir ~                                                       # Saving directory. If not set, it will be `root/arch/model/data`.
weights     : &weights "run/train/dfine/dfine_l/dfine_l_obj2fisheye8kv1_960/best_stg2.pth"  # Path to the pretrained weights.
device      : 0                                                                 # Running device (i.e., cuda:0 | cuda:0,1,2,3 | cpu).
seed        : 0                                                                 # Random seed.
imgsz       : &imgsz ~                                                          # Image size for the model.
resize      : False                                                             # Resize the input image to `imgsz`.
epochs      : &epochs 500                                                       # Training epochs.
steps       : &steps ~                                                          # Training steps.
benchmark   : False                                                             # Benchmark the model.
save_image  : True                                                              # Save the output image.
save_debug  : &save_debug True                                                  # Save the debug information.
use_fullname: True                                                              # Use the full name for the save_dir.
keep_subdirs: False                                                             # Keep subdirectories in the save_dir.
exist_ok    : True                                                              # If ``False``, it will delete the save directory if it already exists.
verbose     : &verbose True                                                     # Verbosity.

# Misc
cfg_path    : "dfine/custom/dfine_hgnetv2_l_obj2custom.yaml"                    # Fine-tuning from Objects365 pre-trained weights.
resume      : "run/train/dfine/dfine_l/dfine_l_obj2fisheye8kv1_960/last.pth"    # Resume from checkpoint
tuning      : "zoo/vision/detect/dfine/dfine_l/objects365/dfine_l_objects365_e25.pth" # Fine-tuning from checkpoint
use_amp     : False                                                             # Use automatic mixed precision (AMP) for training.
test_only   : False                                                             # Test only.
print_method: "builtin"                                                         # Print method.
print_rank  : 0                                                                 # Print rank ID.
local_rank  : 0                                                                 # Local rank ID.

# We only need to change the '__include__' part in the original config file.
__include__: [
  "../../dataset/fisheye8kv1_detection.yaml",
  "../../runtime.yaml",
  "../include/dataloader_960.yaml",
  "../include/optimizer.yaml",
  "../include/dfine_hgnetv2_960.yaml",
]
